name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不指定 version — 由 package.json 的 "packageManager": "pnpm@11.22.0" 決定，
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma client 與 shared 的 dist 都不進版控；沒有它們，型別會退化成 any，
      # typescript-eslint 的 no-unsafe-* 規則會整片報錯。
      - name: Generate Prisma client
        run: pnpm --filter @expense-review-agent/api prisma:generate

      - name: Build shared package
        run: pnpm --filter @expense-review-agent/shared build

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
